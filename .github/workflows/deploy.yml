name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/chess-opening-app-qeaomu, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Without this the repository keeps its legacy "deploy from a branch"
      # source, whose builder publishes the unbuilt repository root and races
      # this workflow on every push. configure-pages only creates a missing
      # site, it won't convert an existing one, so switch it explicitly.
      - name: Make GitHub Actions the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || echo "::warning::Could not switch the Pages source automatically. Set Settings -> Pages -> Source to 'GitHub Actions'."

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repository if it isn't already.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
