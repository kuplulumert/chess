<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Trainer</title>
    <script>
      // Set the theme before first paint so there's no flash of the wrong
      // colors. Defaults to dark when nothing has been chosen yet.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("chess-opening-trainer-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
