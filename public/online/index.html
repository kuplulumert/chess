<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkadaşınla Online Satranç</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <h1>Arkadaşınla Online Satranç</h1>

      <section id="lobby" class="panel">
        <button id="create-btn" type="button">Yeni Oyun Oluştur</button>

        <div id="share-panel" class="hidden">
          <p>Bu linki arkadaşına gönder, tıkladığında oyun otomatik başlayacak:</p>
          <div class="share-row">
            <input id="share-link" type="text" readonly />
            <button id="copy-btn" type="button">Kopyala</button>
          </div>
        </div>

        <ol id="steps" class="steps hidden">
          <li data-step="net"><span class="step-icon">○</span> Sunucuya bağlanılıyor</li>
          <li data-step="wait"><span class="step-icon">○</span> <span id="step-wait-text">Rakip bekleniyor</span></li>
          <li data-step="ready"><span class="step-icon">○</span> Oyun hazır</li>
        </ol>

        <ul id="transports" class="transports hidden"></ul>

        <p id="wait-clock" class="status subtle"></p>
        <p id="lobby-status" class="status"></p>
        <p id="room-label" class="status subtle"></p>
        <button id="retry-btn" type="button" class="hidden">Tekrar Dene</button>
      </section>

      <section id="game" class="hidden">
        <div class="status-bar">
          <span id="color-label"></span>
          <span id="conn-label" class="conn-ok">● bağlı</span>
          <span id="turn-label"></span>
        </div>

        <div id="board" class="board"></div>

        <p id="game-status" class="status"></p>
        <p id="last-move" class="status subtle"></p>

        <button id="leave-btn" type="button">Ana Sayfaya Dön</button>
      </section>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
